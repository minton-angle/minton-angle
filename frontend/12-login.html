<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>로그인</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/12-logIn.css">

  <script src="js/common.js"></script>
</head>

<body>
    <div class="mobile-container">
        <div class="logo-box"></div>

        <form class="login-form">
            <div class="input-row-box">
                <span class="input-label">아이디</span>
                <input type="text" placeholder="아이디를 입력하세요">
            </div>

            <div class="input-row-box">
                <span class="input-label">비밀번호</span>
                <input type="password" placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="login-submit-btn">로그인</button>
        </form>

        <div class="signup-guide">
            <p>아직 계정이 없으신가요?</p>
            <button type="button" class="goto-signup-btn" onclick="location.href='signup.html'">회원가입</button>
        </div>
    </div>
    <script src="js/12-logIn.js"></script>
</body>
