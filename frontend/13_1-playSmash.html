<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>경기 영상 업로드</title>
    
    <script src="js/common.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/13_1-playSmash.css">
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <button class="back-btn" onclick="history.back()">
                <img src="assets/images/arrow_back.png" alt="뒤로가기">
            </button>
            <h1 class="header-title">스매시 분석 가이드</h1>
        </header>

        <div class="scroll-container">
            <main class="upload-content">
                <div class="upload-section">
                    <div class="upload-box" id="example-box">
                        <div class="video-preview" style="display: block;">
                            <video id="preview-video" src="assets/videos/example_smash.mp4" playsinline muted loop autoplay></video>
                        </div>
                    </div>
                </div>

                <div class="info-container">
                    <div class="info-card">
                        <p class="info-highlight">
                            위 영상처럼 촬영하면<br>
                            <strong>더 정확한 피드백을 받을 수 있어요!</strong>
                        </p>
                        <ul class="info-list">
                            <li><span>•</span><p><strong>촬영 구도:</strong> 가로로 눕혀서 촬영해주세요.</p></li>
                            <li><span>•</span><p><strong>촬영 거리:</strong> 전신과 셔틀콕 궤적이 다 담기게 멀리서 촬영해주세요.</p></li>
                            <li><span>•</span><p><strong>조명 확인:</strong> 그림자나 반사가 적은 곳이 좋습니다.</p></li>
                        </ul>
                    </div>
                </div>
            </main>
        </div>

        <footer class="bottom-action">
            <button class="submit-btn" id="go-next-btn" onclick="goToUpload()">분석하러 가기</button>
        </footer>
    </div>
    <script src="js/13_1-playSmash.js"></script>
</body>
</html>
