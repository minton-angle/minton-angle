<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>회원가입</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/11-signUp.css">
</head>
<body>
    <div class="mobile-container">
        <div class="scroll-container">
            <header class="header">
                <button class="back-btn" onclick="logIn.back()"></button>
                <h1 class="header-title">회원가입</h1>
            </header>
            <hr class="divider">

            <form class="signup-form">
                <div class="field-group">
                    <label>이름</label>
                    <input type="text" placeholder="한글 또는 영문으로만 입력해주세요">
                </div>

                <div class="row-group">    
                    <div class="field-group half">
                        <label>성별</label>
                        <div class="gender-toggle-container">
                            <button type="button" class="gender-btn female" data-gender="female">여성</button>
                            <button type="button" class="gender-btn male" data-gender="male">남성</button>
                        </div>
                    </div>

                    <div class="field-group half">
                        <label>손</label>
                        <div class="hand-toggle-container">
                            <button type="button" class="hand-btn left" data-hand="left">왼손</button>
                            <button type="button" class="hand-btn right" data-hand="right">오른손</button>
                    </div>
                </div>
                </div>

                <div class="field-group">
                    <label>아이디</label>
                    <div class="input-with-btn">
                        <input type="text" placeholder="영문 또는 숫자로 4~12자 사이로 입력해주세요">
                        <button type="button" class="check-btn">중복 확인</button>
                    </div>
                </div>

                <div class="field-group">
                    <label>비밀번호</label>
                    <input type="password" placeholder="영문 또는 숫자를 조합하여 8자 이상 입력해주세요">
                </div>

                <div class="field-group">
                    <label>비밀번호 확인</label>
                    <input type="password" placeholder="비밀번호를 다시 입력해주세요">
                </div>

                <button type="submit" class="submit-btn">회원가입</button>
            </form>
        </div>
    </div>
    <script src="js/11-signUp.js"></script>     
</body>
