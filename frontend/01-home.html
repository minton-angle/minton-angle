<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>홈</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/01-home.css">
</head>
<body>
    <div id="root">
        <div class="mobile-container">
            <div class="content-wrapper">
                
                <div class="scroll-container home-bg">
                    <main>
                        <div class="top-bar">
                            <div class="logo-box"></div>
                        </div>
                        <section class="user-section">
                            <div class="user-image-container"></div>
                            <div class="user-info">
                                <div class="user-name">김고수 님</div>
                                <div class="user-welcome">환영합니다!</div>
                            </div>
                            <button class="info-box"></button>
                        </section>

                        <section class="btn-section">
                            <div class="selectmode-section">연습 모드를<br>선택해주세요!</div>
                            <button class="btn-grib"><div class="btn-content">그립 교정</div></button>
                            <button class="btn-pose"><div class="btn-content2">기본 스윙 교정</div></button>
                        </section>
                    </main>
                </div>

                <nav class="navbar-section">
                    <div class="nav-item">
                        <button class="nav-btn nav-home"></button>
                    </div>
                    <div class="nav-item">
                        <button class="nav-btn nav-play"></button>
                    </div>
                    <div class="nav-item">
                        <button class="nav-btn nav-history"></button>
                    </div>
                    <div class="nav-item">
                        <button class="nav-btn nav-myPage"></button>
                    </div>
                </nav>

            </div> 

            <div id="guideModal" class="modal-overlay">
                <div class="modal-content">
                    <button class="close-btn" id="closeGuide">&times;</button>
        
                    <div class="guide-header">
                        <h2> 🔎 이용 가이드 </h2>
                    </div>

                    <div class="tutorial-wrapper">
                        <div class="tutorial-slider" id="tutorialSlider">
                            <img src="assets/images/tutorial_1.png" alt="1" class="t-img">
                            <img src="assets/images/tutorial_2.png" alt="2" class="t-img">
                            <img src="assets/images/tutorial_3.png" alt="3" class="t-img">
                            <img src="assets/images/tutorial_4.png" alt="4" class="t-img">
                        </div>
                    </div>

                    <div class="dot-container" id="dotContainer">
                        <span class="t-dot active"></span>
                        <span class="t-dot"></span>
                        <span class="t-dot"></span>
                        <span class="t-dot"></span>
                    </div>
                </div>
            </div>

        </div> 
    </div> 
    <script src="js/01-home.js"></script>
    <script src="js/common.js"></script> 
</body>
</html>
