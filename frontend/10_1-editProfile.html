<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>정보 수정</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/10_1-editProfile.css">
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <button class="back-btn" onclick="location.href='10-myPage.html'"></button>
            <h1 class="header-title">정보 수정</h1>
        </header>

        <div class="scroll-container">
            <form class="signup-form" id="editProfileForm">
                <div class="field-group">
                    <label>이름</label>
                    <input type="text" id="editNickname" placeholder="이름을 입력하세요">
                </div>
                
                <div class="row-group">    
                    <div class="field-group half">
                        <label>성별</label>
                        <input type="text" id="editGender" readonly class="readonly-field">
                    </div>
                    <div class="field-group half">
                        <label>손</label>
                        <input type="text" id="editHand" readonly class="readonly-field">
                    </div>
                </div>

                <div class="field-group">
                    <label>아이디</label>
                    <input type="text" id="editId" readonly class="readonly-field">
                </div>

                <div class="field-group">
                    <label>새 비밀번호</label>
                    <input type="password" id="editPw" placeholder="변경 시에만 입력 (8자 이상)">
                </div>

                <div class="field-group">
                    <label>새 비밀번호 확인</label>
                    <input type="password" id="editPwConfirm" placeholder="비밀번호를 다시 입력하세요">
                </div>

                

                <button type="submit" class="submit-btn">변경사항 저장</button>
            </form>
        </div>
    </div>
        
    <script src="js/common.js"></script>
    <script src="js/10_1-editProfile.js"></script>
</body>
</html>
