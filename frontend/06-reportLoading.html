<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 분석 리포트 생성 중</title>

    <script src="js/common.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/06-reportLoading.css">
</head>
<body>
    <div class="app-wrapper loading-bg">
        <main class="loading-container">
            <div class="spinner-box">
                <div class="circle-spinner"></div>
            </div>
            
            <div class="loading-text-group">
                <h1 class="loading-title">AI 리포트 생성중...</h1>
                <p class="loading-sub">잠시만 기다려주세요</p>
            </div>
        </main>
    </div>

    <script>
        // ⭐ URL 파라미터 읽기
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('post_id');
        const type = urlParams.get('type');
        
        console.log('📊 로딩 화면:', { postId, type });
        
        if (!postId || !type) {
            console.error('❌ post_id 또는 type 없음');
            alert('잘못된 접근입니다.');
            window.location.href = '01-home.html';
        } else {
            // ⭐ 3초 뒤 리포트로 이동 (파라미터 전달!)
            setTimeout(() => {
                const reportUrl = `07-reportDetail.html?post_id=${postId}&type=${type}`;
                console.log('🔗 이동:', reportUrl);
                window.location.href = reportUrl;
            }, 3000);
        }
    </script>
    <script src="js/06-reportLoading.js"></script>
</body>
</html>
