<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스윙 분석 리포트</title>

    <script src="js/common.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/07-reportDetail.css">
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <button class="back-btn" onclick="location.href='01-home.html'">
                <img src="assets/images/arrow_back.png" alt="뒤로가기">
            </button>
            <h1 class="header-title">스윙 분석 리포트</h1>
        </header>

        <div class="scroll-container">
            <main class="report-content">
                
                <section class="report-card overall-card">
                    <div class="card-header">
                        <p class="card-subtitle">전문가와 비교한 내 스윙 분석 결과</p>
                    </div>
                    <div class="card-body">
                        <div class="overall-info">
                            <h2 class="overall-grade" id="overall-grade">분석 중...</h2>
                            <p class="overall-comment" id="overall-comment">잠시만 기다려주세요.</p>
                        </div>
                        <div class="chart-container">
                            <svg viewBox="0 0 100 100" class="score-svg">
                                <circle class="bg" cx="50" cy="50" r="45"></circle>
                                <circle class="meter" id="score-meter" cx="50" cy="50" r="45"></circle>
                            </svg>
                            <div class="score-text">
                                <span id="overall-score">0</span><span class="unit">점</span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="phase-section">
                    <div class="phase-header">
                        <span class="phase-number">1</span>
                        <h3 class="phase-title">준비자세</h3>
                        <span class="phase-badge" id="phase1-badge">--점</span>
                    </div>
                    <div class="phase-content">
                        <div class="comparison-container">
                            <div class="comparison-item">
                                <span class="comparison-label">나의 자세</span>
                                <div class="media-box"><img id="phase1-user-img" src="" alt="나의 자세"></div>
                            </div>
                            <div class="comparison-item">
                                <span class="comparison-label">전문가</span>
                                <div class="media-box"><img id="phase1-expert-img" src="assets/1_ready_hybrid.jpg" alt="전문가"></div>
                            </div>
                        </div>
                        <div class="eval-container">
                            <div class="eval-item"><span class="eval-name">팔꿈치 높이</span><span class="eval-status" id="eval-1">--</span></div>
                            <div class="eval-item"><span class="eval-name">보조 손</span><span class="eval-status" id="eval-2">--</span></div>
                            <div class="eval-item"><span class="eval-name">상체 열림</span><span class="eval-status" id="eval-3">--</span></div>
                        </div>
                    </div>
                </section>

                <section class="phase-section">
                    <div class="phase-header">
                        <span class="phase-number">2</span>
                        <h3 class="phase-title">스윙</h3>
                        <span class="phase-badge" id="phase2-badge">--점</span>
                    </div>
                    <div class="phase-content">
                        <div class="comparison-container">
                            <div class="comparison-item">
                                <span class="comparison-label">나의 스윙</span>
                                <div class="media-box video-box">
                                    <video id="phase2-user-video" muted playsinline><source src="" type="video/mp4"></video>
                                </div>
                            </div>
                            <div class="comparison-item">
                                <span class="comparison-label">전문가</span>
                                <div class="media-box video-box">
                                    <video id="phase2-expert-video" muted playsinline><source src="assets/2_rotation_hybrid.mp4" type="video/mp4"></video>
                                </div>
                            </div>
                        </div>
                        <button class="sync-play-btn" onclick="syncPlayVideos('phase2')">▶️ 동시에 재생하기</button>

                        <div class="eval-container">
                            <div class="eval-item"><span class="eval-name">🔄 어깨 회전</span><span class="eval-status" id="eval-4">--</span></div>
                        </div>

                        <div class="sub-section">
                            <h4 class="sub-title">📸 키프레임 상세 비교</h4>
                            
                            <div class="keyframe-group">
                                <p class="keyframe-label-main">* 백스윙</p>
                                <div class="comparison-container">
                                    <div class="comparison-item">
                                        <span class="comparison-label">나의 자세</span>
                                        <div class="media-box small"><img id="phase2-backswing-img" src="" alt="나의 자세"></div>
                                    </div>
                                    <div class="comparison-item">
                                        <span class="comparison-label">전문가</span>
                                        <div class="media-box small"><img src="assets/3_backswing_hybrid.jpg" alt="전문가"></div>
                                    </div>
                                </div>
                                <div class="eval-container mini">
                                    <div class="eval-item" data-id="5"><span class="eval-name">💪 팔꿈치 L자</span><span class="eval-status" id="eval-5">--</span></div>
                                    <div class="eval-item" data-id="6"><span class="eval-name">↩️ 백스윙 깊이</span><span class="eval-status" id="eval-6">--</span></div>
                                </div>
                            </div>

                            <div class="keyframe-group">
                                <p class="keyframe-label-main">* 임팩트</p>
                                <div class="comparison-container">
                                    <div class="comparison-item">
                                        <span class="comparison-label">나의 자세</span>
                                        <div class="media-box small"><img id="phase2-impact-img" src="" alt="나의 자세"></div>
                                    </div>
                                    <div class="comparison-item">
                                        <span class="comparison-label">전문가</span>
                                        <div class="media-box small"><img src="assets/4_impact_hybrid.jpg" alt="전문가"></div>
                                    </div>
                                </div>
                                <div class="eval-container mini">
                                    <div class="eval-item" data-id="7"><span class="eval-name">🦾 팔 펴짐</span><span class="eval-status" id="eval-7">--</span></div>
                                    <div class="eval-item" data-id="8"><span class="eval-name">📍 타점 높이</span><span class="eval-status" id="eval-8">--</span></div>
                                </div>
                            </div>
                        </div> </div> </section> <section class="phase-section">
                    <div class="phase-header">
                        <span class="phase-number">3</span>
                        <h3 class="phase-title">팔로우스루</h3>
                        <span class="phase-badge" id="phase3-badge">--점</span>
                    </div>
                    <div class="phase-content">
                        <div class="comparison-container">
                            <div class="comparison-item">
                                <span class="comparison-label">나의 영상</span>
                                <div class="media-box video-box">
                                    <video id="phase3-user-video" muted playsinline><source src="" type="video/mp4"></video>
                                </div>
                            </div>
                            <div class="comparison-item">
                                <span class="comparison-label">전문가</span>
                                <div class="media-box video-box">
                                    <video id="phase3-expert-video" muted playsinline><source src="assets/5_follow_hybrid.mp4" type="video/mp4"></video>
                                </div>
                            </div>
                        </div>
                        <button class="sync-play-btn" onclick="syncPlayVideos('phase3')">▶️ 동시에 재생하기</button>
                        <div class="eval-container">
                            <div class="eval-item"><span class="eval-name">🎯 팔로우스루</span><span class="eval-status" id="eval-9">--</span></div>
                        </div>
                    </div>
                </section>

                <div class="bottom-notice-box">
                    <p class="notice-text">위 내용은 <span class="highlight">기록 섹션</span>에서 언제든지 다시 확인하실 수 있습니다.</p>
                </div>
            </main>
        </div>
    </div>
    <script src="js/07-reportDetail.js"></script>
</body>
</html>
