<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>민턴각 - 리포트 캘린더</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/09-reportHistory.css">
</head>
<body>
    <div class="mobile-container">
        <div class="content-wrapper history-bg">
            <header class="header">
                <div class="logo-box-left"></div>
            </header>

            <div class="scroll-container">
                <main class="calendar-content">
                    <div class="glass-title-unit">
                        <h2 class="section-title">🗓️ 리포트 캘린더 🗓️</h2>
                    </div>
                    
                    <div class="calendar-card">
                        <div id="calendar"></div>
                        <div class="calendar-footer">
                            <span class="label">Time</span>
                            <span class="time-value" id="current-time">9:41 AM</span>
                        </div>
                    </div>

                    <div class="toggle-wrapper">
                        <div class="toggle-slider" id="slider"></div>
                        <button class="toggle-btn active" id="btn-calendar" onclick="moveSlider('left')">
                            리포트 캘린더<br><span class="sub-txt">*날짜별 리포트를 보고싶다면?</span>
                        </button>
                        <button class="toggle-btn" id="btn-total" onclick="moveSlider('right')">
                            성장 리포트<br><span class="sub-txt">*얼마나 성장했는지 보고싶다면?</span>
                        </button>
                    </div>

                    <p class="guide-text">
                        ** 활성화된 날짜를 누르면 해당 일자에 생성한<br>
                        리포트를 열람하실 수 있습니다.
                    </p>
                </main>
            </div>

            <nav class="navbar-section">
                <div class="nav-item"><button class="nav-btn nav-home" onclick="location.href='01-home.html'"></button></div>
                <div class="nav-item"><button class="nav-btn nav-gym"></button></div>
                <div class="nav-item"><button class="nav-btn nav-history active"></button></div>
                <div class="nav-item"><button class="nav-btn nav-settings"></button></div>
            </nav>
        </div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src="js/09-reportHistory.js"></script>
</body>
</html>
