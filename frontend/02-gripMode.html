<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>기본 그립 가이드</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/02-gripMode.css">
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <button class="back-btn" onclick="history.back()">
                <img src="assets/images/arrow_back.png" alt="뒤로가기">
            </button>
            <h1 class="header-title">기본 그립 가이드</h1>
        </header>

        <div class="scroll-container">
            <main class="grip-content">
                <div class="guide-section">
                    <h2 class="main-title"> 그립 가이드 이미지 </h2>
                    <p class="sub-desc"> * 라켓 헤드를 정면으로 돌린 채, 손만 확대하여 비춰주세요 </p>
                    
                    <div class="image-pair">
                        <div class="img-box">
                            <img src="assets/images/gripGuide.jpg" alt="그립 가이드">
                        </div>
                    </div>

                    <div class="warning-container">
                        <p class="warning-msg"> ⚠️ 올바른 교정을 하기 위해 촬영하시기 전,<br><span>아래 가이드라인을 꼭 읽어주세요!</span></p>
                        
                        <div class="info-card">
                            <h3 class="info-card-title">🏸 올바른 그립 가이드 🏸</h3>
                            <ul class="info-list">
                                <li><span>1.</span> 라켓 면이 바닥과 수직이 되도록 세워주세요.</li>
                                <li><span>2.</span> 손잡이를 편안하게 악수하듯 감싸 쥐어주세요.</li>
                                <li><span>3.</span> 엄지와 검지 사이의 V자 부분이 손잡이 왼쪽 대각선 모서리에 오도록 해주세요.</li>
                                <li><span>4.</span> 검지를 살짝 위로 올려 방아쇠를 당기는 듯한 여유 공간을 만들어주세요.</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <footer class="bottom-action">
            <button class="next-btn">그립 교정하기</button>
        </footer>
    </div>
    <script src="js/02-gripMode.js"></script>
</body>
</html>
