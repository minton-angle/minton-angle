<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스윙 실시간 분석</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/05-swingAnalyze.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <button class="back-btn" onclick="history.back()">
                <img src="assets/images/arrow_back.png" alt="뒤로가기">
            </button>
            <h1 class="header-title">실시간 스윙 분석</h1>
        </header>

        <div class="scroll-container analyze-bg">
            <main class="analyze-main">
                <p id="top-guide-text" class="top-guide">머리부터 발끝까지 전신이 모두 화면에 담기도록 해주세요.</p>

                <div class="camera-section">
                    <video id="input_video" style="display:none;" playsinline></video>
                    <canvas id="output_canvas"></canvas>
                    <div id="countdown-number" class="countdown-large"></div>
                </div>

                <div class="progress-container">
                    <div id="analysis-progress" class="progress-bar"></div>
                </div>

                <div id="feedback-text" class="feedback-bubble">
                    "시작"이라고 말하면 분석이 시작됩니다 🎙️
                </div>

                <div class="result-card">
                    <div class="swing-row" id="row-1">
                        <div class="swing-label">🏸 스윙 1회 :</div>
                        <div class="status-group">
                            <div class="status-item" id="res-1-bad">나쁨</div>
                            <div class="status-item" id="res-1-normal">보통</div>
                            <div class="status-item" id="res-1-good">잘함</div>
                        </div>
                    </div>
                    <div class="swing-row" id="row-2">
                        <div class="swing-label">🏸 스윙 2회 :</div>
                        <div class="status-group">
                            <div class="status-item" id="res-2-bad">나쁨</div>
                            <div class="status-item" id="res-2-normal">보통</div>
                            <div class="status-item" id="res-2-good">잘함</div>
                        </div>
                    </div>
                    <div class="swing-row" id="row-3">
                        <div class="swing-label">🏸 스윙 3회 :</div>
                        <div class="status-group">
                            <div class="status-item" id="res-3-bad">나쁨</div>
                            <div class="status-item" id="res-3-normal">보통</div>
                            <div class="status-item" id="res-3-good">잘함</div>
                        </div>
                    </div>
                </div>

                
            </main>
        </div>
        </div>
    <script src="js/05-swingAnalyze.js"></script>
    <script src="js/common.js"></script> 
</body>
</html>
