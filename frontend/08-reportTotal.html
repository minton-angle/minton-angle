<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minton Angle - LLM Report</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/08-reportTotal.css">
</head>

<body class="page-reportTotal">
  <div class="app-wrapper">
    <header class="topbar">
      <div class="topbar__title">종합 AI 피드백 리포트</div>
    </header>

    <main class="scroll-container">
      <section class="card card--summary">
        <div class="summary__left">
          <h1 id="summaryHeadline" class="summary__headline">안녕하세요!</h1>
          <div id="summarySub" class="summary__sub"> LLM 리포트 요약해드려용~</div>
        </div>

        <div class="summary__right">
          <div class="scoreRing" aria-label="점수 70점">
            <svg class="scoreRing__svg" viewBox="0 0 120 120">
              <circle class="scoreRing__bg" cx="60" cy="60" r="46"></circle>
              <circle id="scoreRingFg" class="scoreRing__fg" cx="60" cy="60" r="46" style="stroke-dashoffset: 86.7;"></circle>
            </svg>
            <div class="scoreRing__text">
              <div id="scoreValue" class="scoreRing__num">70</div>
              <div class="scoreRing__unit">점</div>
            </div>
          </div>
        </div>
      </section>

      <section class="card card--charts">
        <div class="miniGrid">
          <div class="miniCard miniCard--wide">
            <div class="miniCard__head">
              <div class="miniCard__label">SCORE 변화 추이</div>
            </div>
            <canvas id="scoreKfHistoryChart"></canvas>
            <div class="kfTabsWrap">
              <div class="rangeTabs" role="tablist" aria-label="기간 필터">
                <button type="button" class="rangeTab is-active" data-range="7d" aria-selected="true">1주일</button>
                <button type="button" class="rangeTab" data-range="1m" aria-selected="false">1개월</button>
                <button type="button" class="rangeTab" data-range="3m" aria-selected="false">3개월</button>
                <button type="button" class="rangeTab" data-range="all" aria-selected="false">전체</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="card card--llmGen">
        <h2>LLM 리포트 생성</h2>
        <button type="button" id="btnGenerateLLM" class="btnLLM btnLLM--big" aria-label="LLM 리포트 생성/갱신">LLM 리포트 업데이트</button>
      </section>

      <section class="card">
        <h2>동작별 분석</h2>
      
        <div class="actionCards" aria-label="동작별 분석 카드">
          <article class="actionCard" id="actionCard1">
            <div class="actionCard__top">
              <div class="actionCard__title">준비 자세</div>
              <div class="actionCard__right">
                <div class="actionCard__pill" id="a1TrendPill">-</div>
                <div class="halfGauge" aria-label="백스윙 점수">
                  <svg class="halfGauge__svg" viewBox="0 0 120 70" role="img" aria-hidden="true">
                    <path class="halfGauge__bg" d="M10,60 A50,50 0 0 1 110,60" />
                    <path id="a1GaugeFg" class="halfGauge__fg" d="M10,60 A50,50 0 0 1 110,60" />
                  </svg>
                  <div class="halfGauge__text"><span id="a1GaugeValue"></span><span class="halfGauge__unit">점</span></div>
                </div>
              </div>
            </div>
            <div class="actionCard__meta" id="a1Meta"></div>
            <div class="actionMiniChartWrap" aria-label="동작 점수 변화 추이">
              <canvas id="a1StageChart" class="actionMiniChart"></canvas>
            </div>
            <div class="actionCard__body" id="a1Body"></div>
          </article>

          <article class="actionCard" id="actionCard2">
            <div class="actionCard__top">
              <div class="actionCard__title">회전</div>
              <div class="actionCard__right">
                <div class="actionCard__pill" id="a2TrendPill">-</div>
                <div class="halfGauge" aria-label="임팩트 점수">
                  <svg class="halfGauge__svg" viewBox="0 0 120 70" role="img" aria-hidden="true">
                    <path class="halfGauge__bg" d="M10,60 A50,50 0 0 1 110,60" />
                    <path id="a2GaugeFg" class="halfGauge__fg" d="M10,60 A50,50 0 0 1 110,60" />
                  </svg>
                  <div class="halfGauge__text"><span id="a2GaugeValue"></span><span class="halfGauge__unit">점</span></div>
                </div>
              </div>
            </div>
            <div class="actionCard__meta" id="a2Meta"></div>
            <div class="actionMiniChartWrap" aria-label="동작 점수 변화 추이">
              <canvas id="a2StageChart" class="actionMiniChart"></canvas>
            </div>
            <div class="actionCard__body" id="a2Body"></div>
          </article>

          <article class="actionCard" id="actionCard3">
            <div class="actionCard__top">
              <div class="actionCard__title">백스윙</div>
              <div class="actionCard__right">
                <div class="actionCard__pill" id="a3TrendPill">-</div>
                <div class="halfGauge" aria-label="팔로스루 점수">
                  <svg class="halfGauge__svg" viewBox="0 0 120 70" role="img" aria-hidden="true">
                    <path class="halfGauge__bg" d="M10,60 A50,50 0 0 1 110,60" />
                    <path id="a3GaugeFg" class="halfGauge__fg" d="M10,60 A50,50 0 0 1 110,60" />
                  </svg>
                  <div class="halfGauge__text"><span id="a3GaugeValue"></span><span class="halfGauge__unit">점</span></div>
                </div>
              </div>
            </div>
            <div class="actionCard__meta" id="a3Meta"></div>
            <div class="actionMiniChartWrap" aria-label="동작 점수 변화 추이">
              <canvas id="a3StageChart" class="actionMiniChart"></canvas>
            </div>
            <div class="actionCard__body" id="a3Body"></div>
          </article>

          <article class="actionCard" id="actionCard4">
            <div class="actionCard__top">
              <div class="actionCard__title">임팩트</div>
              <div class="actionCard__right">
                <div class="actionCard__pill" id="a4TrendPill">-</div>
                <div class="halfGauge" aria-label="임팩트 점수">
                  <svg class="halfGauge__svg" viewBox="0 0 120 70" role="img" aria-hidden="true">
                    <path class="halfGauge__bg" d="M10,60 A50,50 0 0 1 110,60" />
                    <path id="a4GaugeFg" class="halfGauge__fg" d="M10,60 A50,50 0 0 1 110,60" />
                  </svg>
                  <div class="halfGauge__text"><span id="a4GaugeValue"></span><span class="halfGauge__unit">점</span></div>
                </div>
              </div>
            </div>
            <div class="actionCard__meta" id="a4Meta"></div>
            <div class="actionMiniChartWrap" aria-label="동작 점수 변화 추이">
              <canvas id="a4StageChart" class="actionMiniChart"></canvas>
            </div>
            <div class="actionCard__body" id="a4Body"></div>
          </article>

          <article class="actionCard" id="actionCard5">
            <div class="actionCard__top">
              <div class="actionCard__title">팔로스윙</div>
              <div class="actionCard__right">
                <div class="actionCard__pill" id="a5TrendPill">-</div>
                <div class="halfGauge" aria-label="팔로스윙 점수">
                  <svg class="halfGauge__svg" viewBox="0 0 120 70" role="img" aria-hidden="true">
                    <path class="halfGauge__bg" d="M10,60 A50,50 0 0 1 110,60" />
                    <path id="a5GaugeFg" class="halfGauge__fg" d="M10,60 A50,50 0 0 1 110,60" />
                  </svg>
                  <div class="halfGauge__text"><span id="a5GaugeValue"></span><span class="halfGauge__unit">점</span></div>
                </div>
              </div>
            </div>
            <div class="actionCard__meta" id="a5Meta"></div>
            <div class="actionMiniChartWrap" aria-label="팔로스윙 성공/실패 비율">
              <canvas id="followSwingDonutChart" class="actionMiniChart"></canvas>
            </div>
            <div class="actionCard__body" id="a5Body"></div>
          </article>
        </div>
      </section>
      <section class="card">
        <h2>추천 영상</h2>
        <div class="row">
          <div id="llmYoutubeLinks" class="ytGrid"></div>
        </div>
      </section>

    </main>
  </div>

  <script src="js/08-reportTotal.js"></script>
</body>
</html>
